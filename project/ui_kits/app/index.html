<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profindle — UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: #F4F5F7; color: #171A21; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; }
  input  { font-family: inherit; }
</style>
</head>
<body>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="HeroSection.jsx"></script>
<script type="text/babel" src="ProfileCard.jsx"></script>
<script type="text/babel" src="SearchBar.jsx"></script>
<script type="text/babel" src="PremiumBadge.jsx"></script>

<div id="root"></div>

<script type="text/babel">
const PROFILES = [
  { id:1, name:'Alex Morgan', initials:'AM', role:'Senior Product Designer', company:'Stripe', bio:'10+ years crafting delightful digital products. Passionate about systems thinking and accessible design at scale.', skills:['UX Design','Figma','Systems'], connections:'2.4K', projects:'48', rate:'$180/hr', colorIndex:0, premium:true, verified:true, featured:true },
  { id:2, name:'James Liu', initials:'JL', role:'Staff Software Engineer', company:'Vercel', bio:'Full-stack engineer specializing in performance-first web apps. Open source contributor and speaker.', skills:['TypeScript','React','Rust'], connections:'1.8K', projects:'62', rate:'$200/hr', colorIndex:1, premium:true, verified:true, featured:false },
  { id:3, name:'Sofia Reyes', initials:'SR', role:'Growth Marketing Lead', company:'Linear', bio:'Data-driven marketer with a track record of scaling B2B SaaS from seed to Series B.', skills:['SEO','Analytics','Paid'], connections:'3.1K', projects:'29', rate:'$140/hr', colorIndex:2, premium:false, verified:true, featured:false },
  { id:4, name:'Kai Nakamura', initials:'KN', role:'AI/ML Engineer', company:'Anthropic', bio:'Building the next generation of intelligent systems. PhD in Computer Science, NeurIPS contributor.', skills:['Python','PyTorch','LLMs'], connections:'980', projects:'17', rate:'$240/hr', colorIndex:3, premium:true, verified:false, featured:false },
  { id:5, name:'Priya Sharma', initials:'PS', role:'Head of Product', company:'Notion', bio:'Led product teams from 0→1 at three startups. Focused on creator tools and knowledge management.', skills:['Roadmapping','Strategy','Data'], connections:'4.2K', projects:'35', rate:'$190/hr', colorIndex:0, premium:false, verified:true, featured:true },
  { id:6, name:'Luca Bianchi', initials:'LB', role:'Brand Designer', company:'Framer', bio:'Visual storyteller with deep expertise in brand identity, motion design, and digital experiences.', skills:['Branding','Motion','3D'], connections:'1.2K', projects:'54', rate:'$160/hr', colorIndex:1, premium:true, verified:false, featured:false },
];

function App() {
  const [page, setPage] = React.useState('landing');
  const [selectedProfile, setSelectedProfile] = React.useState(null);
  const [query, setQuery] = React.useState('');
  const [filter, setFilter] = React.useState('All');
  const user = { initials: 'AM' };

  const handleNavigate = (p) => {
    if (p === 'discover') setPage('discover');
    else if (p === 'profile') setPage('myprofile');
    else if (p === 'upgrade') setPage('upgrade');
    else setPage(p);
  };

  const filteredProfiles = PROFILES.filter(p => {
    const q = query.toLowerCase();
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.role.toLowerCase().includes(q) || p.skills.join(' ').toLowerCase().includes(q);
    const matchF = filter === 'All' || p.skills.some(s => s.toLowerCase().includes(filter.toLowerCase())) || p.role.toLowerCase().includes(filter.toLowerCase());
    return matchQ && matchF;
  });

  if (page === 'landing') return <LandingPage onNavigate={handleNavigate} />;
  if (page === 'signup') return <SignUpPage onNavigate={handleNavigate} />;
  if (page === 'upgrade') return (
    <div>
      <Header currentPage="upgrade" onNavigate={handleNavigate} user={user} />
      <UpgradePage onNavigate={handleNavigate} />
    </div>
  );
  if (selectedProfile) return (
    <div>
      <Header currentPage="discover" onNavigate={handleNavigate} user={user} />
      <ProfileViewPage profile={selectedProfile} onBack={() => setSelectedProfile(null)} />
    </div>
  );

  return (
    <div>
      <Header currentPage={page} onNavigate={handleNavigate} user={user} />
      <SearchBar query={query} onQuery={setQuery} activeFilter={filter} onFilter={setFilter} />
      <div style={{ maxWidth:1200, margin:'0 auto', padding:'32px 24px', display:'grid', gridTemplateColumns:'1fr 300px', gap:24, alignItems:'start' }}>
        <div>
          {filteredProfiles.length === 0 ? (
            <div style={{ textAlign:'center', padding:'60px 0', color:'#9AA0AE' }}>
              <div style={{ fontSize:32, marginBottom:12 }}>🔍</div>
              <div style={{ fontWeight:600, fontSize:16, color:'#444B5A', marginBottom:6 }}>No results found</div>
              <div style={{ fontSize:14 }}>Try a different search term or filter</div>
            </div>
          ) : (
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))', gap:20 }}>
              {filteredProfiles.map(p => <ProfileCard key={p.id} profile={p} onView={prof => setSelectedProfile(prof)} featured={p.featured} />)}
            </div>
          )}
        </div>
        <aside style={{ display:'flex', flexDirection:'column', gap:20, position:'sticky', top:80 }}>
          <PremiumBadge onUpgrade={() => setPage('upgrade')} />
          <div style={{ background:'white', borderRadius:16, padding:'20px', border:'1px solid rgba(15,111,115,0.10)' }}>
            <div style={{ fontSize:12, fontWeight:700, color:'#9AA0AE', letterSpacing:'0.06em', textTransform:'uppercase', marginBottom:14 }}>Trending Skills</div>
            {['AI/Machine Learning','Product Strategy','TypeScript','Brand Design','Growth Hacking'].map((s,i) => (
              <div key={s} style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 0', borderBottom: i<4 ? '1px solid #F4F5F7':'none' }}>
                <div style={{ width:24, height:24, borderRadius:6, background:'#F0F9F9', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, color:'#0F6F73' }}>{i+1}</div>
                <span style={{ fontSize:13, fontWeight:500, color:'#171A21' }}>{s}</span>
              </div>
            ))}
          </div>
        </aside>
      </div>
    </div>
  );
}

function LandingPage({ onNavigate }) {
  return (
    <div>
      <div style={{ position:'fixed', top:0, left:0, right:0, zIndex:100, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 40px', height:64, background:'rgba(14,16,23,0.85)', backdropFilter:'blur(12px)', borderBottom:'1px solid rgba(255,255,255,0.08)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <svg width="20" height="26" viewBox="-3 -3 44 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.56 34.56C27.3966 34.56 34.56 27.3966 34.56 18.56C34.56 9.72345 27.3966 2.56 18.56 2.56C9.72344 2.56 2.56 9.72345 2.56 18.56C2.56 27.3966 9.72344 34.56 18.56 34.56Z" stroke="white" strokeWidth="5.12" strokeLinecap="round"/>
            <path d="M18.56 8.96C23.8619 8.96 28.16 13.2581 28.16 18.56" stroke="#F77F00" strokeWidth="5.12" strokeLinecap="round"/>
            <path d="M5.76001 47.36C5.76001 47.36 5.76001 34.56 18.56 34.56" stroke="white" strokeWidth="5.12" strokeLinecap="round"/>
            <path d="M18.56 34.56L31.36 47.36" stroke="white" strokeWidth="5.12" strokeLinecap="round"/>
            <path d="M18.56 38.4C20.6807 38.4 22.4 36.6808 22.4 34.56C22.4 32.4392 20.6807 30.72 18.56 30.72C16.4392 30.72 14.72 32.4392 14.72 34.56C14.72 36.6808 16.4392 38.4 18.56 38.4Z" fill="#F77F00"/>
          </svg>
          <span style={{ fontWeight:700, fontSize:17, letterSpacing:'-0.02em', color:'white' }}>Profindle</span>
        </div>
        <div style={{ display:'flex', gap:10 }}>
          <button onClick={() => onNavigate('discover')} style={{ fontFamily:'Inter,sans-serif', fontSize:13, fontWeight:500, background:'transparent', color:'rgba(255,255,255,0.7)', border:'none', cursor:'pointer', padding:'8px 14px', borderRadius:8 }}>Sign In</button>
          <button onClick={() => onNavigate('signup')} style={{ fontFamily:'Inter,sans-serif', fontSize:13, fontWeight:700, background:'linear-gradient(135deg,#F77F00,#E06B00)', color:'white', border:'none', cursor:'pointer', padding:'8px 20px', borderRadius:10 }}>Get Started</button>
        </div>
      </div>
      <HeroSection onExplore={() => onNavigate('discover')} onSignUp={() => onNavigate('signup')} />
      <div style={{ maxWidth:1200, margin:'0 auto', padding:'80px 24px' }}>
        <div style={{ textAlign:'center', marginBottom:56 }}>
          <div style={{ fontSize:12, fontWeight:700, color:'#0F6F73', letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:12 }}>How It Works</div>
          <h2 style={{ fontSize:36, fontWeight:800, letterSpacing:'-0.02em', color:'#171A21', marginBottom:14 }}>Built for Ambitious Professionals</h2>
          <p style={{ fontSize:17, color:'#6B7385', maxWidth:520, margin:'0 auto', lineHeight:1.6 }}>Three steps to your next breakthrough connection.</p>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:28 }}>
          {[
            ['01','Create Your Profile','Showcase your skills, experience, and what makes you exceptional.','#0F6F73'],
            ['02','Discover & Connect','Browse professionals matched to your goals. Send connection requests.','#F77F00'],
            ['03','Unlock Opportunities','Premium members get priority visibility and direct access to top talent.','#FF5A5F'],
          ].map(([num, title, desc, color]) => (
            <div key={num} style={{ background:'white', borderRadius:20, padding:'32px 28px', border:'1px solid rgba(15,111,115,0.10)', boxShadow:'0 4px 16px rgba(23,26,33,0.07)' }}>
              <div style={{ fontSize:36, fontWeight:800, color, marginBottom:16, opacity:0.9 }}>{num}</div>
              <h3 style={{ fontSize:18, fontWeight:700, color:'#171A21', marginBottom:10 }}>{title}</h3>
              <p style={{ fontSize:14, color:'#6B7385', lineHeight:1.6 }}>{desc}</p>
            </div>
          ))}
        </div>
        <div style={{ textAlign:'center', marginTop:56 }}>
          <button onClick={() => onNavigate('signup')} style={{ fontFamily:'Inter,sans-serif', fontSize:16, fontWeight:700, background:'linear-gradient(135deg,#0F6F73,#1A9DA3)', color:'white', border:'none', borderRadius:14, padding:'16px 40px', cursor:'pointer', boxShadow:'0 4px 20px rgba(15,111,115,0.3)' }}>Join Profindle Free</button>
        </div>
      </div>
    </div>
  );
}

function SignUpPage({ onNavigate }) {
  const [step, setStep] = React.useState(1);
  const [form, setForm] = React.useState({ name:'', email:'', role:'', password:'' });
  const set = k => e => setForm(f => ({...f, [k]: e.target.value}));

  return (
    <div style={{ minHeight:'100vh', background:'linear-gradient(135deg,#0E1017,#0F6F73)', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
      <div style={{ background:'white', borderRadius:24, padding:'48px 44px', width:'100%', maxWidth:440, boxShadow:'0 24px 80px rgba(0,0,0,0.3)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:36 }}>
          <svg width="24" height="32" viewBox="-3 -3 44 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.56 34.56C27.3966 34.56 34.56 27.3966 34.56 18.56C34.56 9.72345 27.3966 2.56 18.56 2.56C9.72344 2.56 2.56 9.72345 2.56 18.56C2.56 27.3966 9.72344 34.56 18.56 34.56Z" stroke="#0F6F73" strokeWidth="5.12" strokeLinecap="round"/>
            <path d="M18.56 8.96C23.8619 8.96 28.16 13.2581 28.16 18.56" stroke="#F77F00" strokeWidth="5.12" strokeLinecap="round"/>
            <path d="M5.76001 47.36C5.76001 47.36 5.76001 34.56 18.56 34.56" stroke="#0F6F73" strokeWidth="5.12" strokeLinecap="round"/>
            <path d="M18.56 34.56L31.36 47.36" stroke="#0F6F73" strokeWidth="5.12" strokeLinecap="round"/>
            <path d="M18.56 38.4C20.6807 38.4 22.4 36.6808 22.4 34.56C22.4 32.4392 20.6807 30.72 18.56 30.72C16.4392 30.72 14.72 32.4392 14.72 34.56C14.72 36.6808 16.4392 38.4 18.56 38.4Z" fill="#F77F00"/>
          </svg>
          <span style={{ fontWeight:700, fontSize:18, letterSpacing:'-0.02em' }}>
            <span style={{color:'#0F6F73'}}>Pro</span><span style={{color:'#F77F00'}}>find</span><span style={{color:'#0F6F73'}}>le</span>
          </span>
        </div>

        <div style={{ marginBottom:8 }}>
          <div style={{ fontSize:12, fontWeight:700, color:'#9AA0AE', letterSpacing:'0.06em', textTransform:'uppercase', marginBottom:6 }}>Step {step} of 2</div>
          <div style={{ height:4, background:'#F4F5F7', borderRadius:999, overflow:'hidden' }}>
            <div style={{ height:'100%', width: step===1?'50%':'100%', background:'linear-gradient(90deg,#0F6F73,#1A9DA3)', borderRadius:999, transition:'width 400ms cubic-bezier(0.4,0,0.2,1)' }}></div>
          </div>
        </div>

        {step === 1 ? (
          <>
            <h2 style={{ fontSize:26, fontWeight:800, letterSpacing:'-0.02em', color:'#171A21', marginBottom:6, marginTop:24 }}>Create Your Account</h2>
            <p style={{ fontSize:14, color:'#6B7385', marginBottom:28 }}>Join 50,000+ professionals on Profindle.</p>
            {[['Full Name','name','text','e.g. Alex Morgan'],['Email','email','email','you@company.com'],['Password','password','password','Min 8 characters']].map(([label, key, type, ph]) => (
              <div key={key} style={{ marginBottom:16 }}>
                <label style={{ display:'block', fontSize:13, fontWeight:600, color:'#171A21', marginBottom:6 }}>{label}</label>
                <input type={type} placeholder={ph} value={form[key]} onChange={set(key)} style={{ width:'100%', padding:'11px 14px', border:'1.5px solid #E4E7ED', borderRadius:12, fontSize:14, outline:'none', color:'#171A21' }} onFocus={e=>e.target.style.borderColor='#0F6F73'} onBlur={e=>e.target.style.borderColor='#E4E7ED'} />
              </div>
            ))}
            <button onClick={() => setStep(2)} style={{ width:'100%', fontFamily:'Inter,sans-serif', fontSize:15, fontWeight:700, background:'linear-gradient(135deg,#0F6F73,#1A9DA3)', color:'white', border:'none', borderRadius:12, padding:'13px 0', cursor:'pointer', marginTop:8 }}>Continue →</button>
          </>
        ) : (
          <>
            <h2 style={{ fontSize:26, fontWeight:800, letterSpacing:'-0.02em', color:'#171A21', marginBottom:6, marginTop:24 }}>Your Professional Profile</h2>
            <p style={{ fontSize:14, color:'#6B7385', marginBottom:28 }}>Help others find you faster.</p>
            {[['Current Role','role','text','e.g. Senior Designer'],['Company / Freelance','company','text','e.g. Stripe or Freelance']].map(([label, key, type, ph]) => (
              <div key={key} style={{ marginBottom:16 }}>
                <label style={{ display:'block', fontSize:13, fontWeight:600, color:'#171A21', marginBottom:6 }}>{label}</label>
                <input type={type} placeholder={ph} style={{ width:'100%', padding:'11px 14px', border:'1.5px solid #E4E7ED', borderRadius:12, fontSize:14, outline:'none', color:'#171A21' }} onFocus={e=>e.target.style.borderColor='#0F6F73'} onBlur={e=>e.target.style.borderColor='#E4E7ED'} />
              </div>
            ))}
            <div style={{ marginBottom:20 }}>
              <label style={{ display:'block', fontSize:13, fontWeight:600, color:'#171A21', marginBottom:6 }}>Primary Expertise</label>
              <select style={{ width:'100%', padding:'11px 14px', border:'1.5px solid #E4E7ED', borderRadius:12, fontSize:14, outline:'none', color:'#171A21', background:'white' }}>
                {['Design','Engineering','Product','Marketing','Finance','Operations'].map(o => <option key={o}>{o}</option>)}
              </select>
            </div>
            <button onClick={() => onNavigate('discover')} style={{ width:'100%', fontFamily:'Inter,sans-serif', fontSize:15, fontWeight:700, background:'linear-gradient(135deg,#F77F00,#E06B00)', color:'white', border:'none', borderRadius:12, padding:'13px 0', cursor:'pointer' }}>Join Profindle ✦</button>
            <button onClick={() => setStep(1)} style={{ width:'100%', fontFamily:'Inter,sans-serif', fontSize:13, fontWeight:500, background:'transparent', color:'#6B7385', border:'none', cursor:'pointer', padding:'10px 0', marginTop:6 }}>← Back</button>
          </>
        )}
        <p style={{ fontSize:12, color:'#9AA0AE', textAlign:'center', marginTop:20 }}>Already have an account? <span onClick={() => onNavigate('discover')} style={{ color:'#0F6F73', fontWeight:600, cursor:'pointer' }}>Sign in</span></p>
      </div>
    </div>
  );
}

function ProfileViewPage({ profile, onBack }) {
  return (
    <div style={{ paddingTop:80, minHeight:'100vh', background:'#F4F5F7' }}>
      <div style={{ background:'linear-gradient(135deg,#0E1017,#0F6F73)', height:200 }}></div>
      <div style={{ maxWidth:900, margin:'-80px auto 0', padding:'0 24px 60px', position:'relative' }}>
        <div style={{ background:'white', borderRadius:24, padding:'40px', boxShadow:'0 8px 40px rgba(23,26,33,0.12)', marginBottom:24 }}>
          <button onClick={onBack} style={{ fontFamily:'Inter,sans-serif', fontSize:13, fontWeight:600, background:'transparent', border:'1.5px solid #E4E7ED', color:'#444B5A', borderRadius:10, padding:'7px 16px', cursor:'pointer', marginBottom:28, display:'flex', alignItems:'center', gap:6 }}>← Back to Discovery</button>
          <div style={{ display:'flex', gap:24, alignItems:'flex-start', flexWrap:'wrap' }}>
            <div style={{ width:88, height:88, borderRadius:'50%', background:`linear-gradient(135deg,#0F6F73,#1A9DA3)`, display:'flex', alignItems:'center', justifyContent:'center', color:'white', fontWeight:800, fontSize:30, flexShrink:0 }}>{profile.initials}</div>
            <div style={{ flex:1, minWidth:200 }}>
              <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap', marginBottom:4 }}>
                <h1 style={{ fontSize:28, fontWeight:800, letterSpacing:'-0.02em', color:'#171A21' }}>{profile.name}</h1>
                {profile.premium && <span style={{ fontSize:11, fontWeight:700, padding:'3px 10px', borderRadius:999, background:'linear-gradient(135deg,#F77F00,#E06B00)', color:'white' }}>PRO</span>}
              </div>
              <div style={{ fontSize:16, color:'#444B5A', marginBottom:4 }}>{profile.role}</div>
              <div style={{ fontSize:14, color:'#9AA0AE', marginBottom:16 }}>{profile.company}</div>
              <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
                {profile.skills.map(s => <span key={s} style={{ fontSize:12, fontWeight:600, padding:'4px 12px', borderRadius:999, background:'#F0F9F9', color:'#0F6F73' }}>{s}</span>)}
              </div>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:10, flexShrink:0 }}>
              <button style={{ fontFamily:'Inter,sans-serif', fontSize:14, fontWeight:700, background:'linear-gradient(135deg,#0F6F73,#1A9DA3)', color:'white', border:'none', borderRadius:12, padding:'11px 28px', cursor:'pointer', whiteSpace:'nowrap' }}>Connect</button>
              <button style={{ fontFamily:'Inter,sans-serif', fontSize:14, fontWeight:600, background:'transparent', color:'#0F6F73', border:'1.5px solid #0F6F73', borderRadius:12, padding:'11px 28px', cursor:'pointer' }}>Message</button>
            </div>
          </div>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'2fr 1fr', gap:20 }}>
          <div style={{ background:'white', borderRadius:20, padding:'32px', boxShadow:'0 4px 16px rgba(23,26,33,0.07)' }}>
            <h3 style={{ fontSize:17, fontWeight:700, color:'#171A21', marginBottom:16 }}>About</h3>
            <p style={{ fontSize:15, color:'#444B5A', lineHeight:1.7 }}>{profile.bio}</p>
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            {[['Connections', profile.connections],['Projects', profile.projects],['Hourly Rate', profile.rate]].map(([label, val]) => (
              <div key={label} style={{ background:'white', borderRadius:16, padding:'20px 24px', boxShadow:'0 4px 16px rgba(23,26,33,0.07)', textAlign:'center' }}>
                <div style={{ fontSize:26, fontWeight:800, background:'linear-gradient(90deg,#0F6F73,#F77F00)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>{val}</div>
                <div style={{ fontSize:12, color:'#9AA0AE', fontWeight:500, marginTop:4 }}>{label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function UpgradePage({ onNavigate }) {
  const plans = [
    { name:'Free', price:'$0', period:'forever', features:['10 profile views/month','Basic search','Connect with 5 people'], cta:'Current Plan', highlight:false },
    { name:'Pro', price:'$29', period:'per month', features:['Unlimited profile views','Priority in search','Direct messaging','Advanced analytics','Pro badge'], cta:'Upgrade to Pro', highlight:true },
    { name:'Business', price:'$99', period:'per month', features:['Everything in Pro','Team seats (5)','API access','Dedicated support','Custom branding'], cta:'Contact Sales', highlight:false },
  ];
  return (
    <div style={{ paddingTop:80, minHeight:'100vh', background:'#F4F5F7' }}>
      <div style={{ maxWidth:1000, margin:'0 auto', padding:'60px 24px' }}>
        <div style={{ textAlign:'center', marginBottom:52 }}>
          <div style={{ fontSize:12, fontWeight:700, color:'#F77F00', letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:10 }}>✦ Profindle Pro</div>
          <h1 style={{ fontSize:40, fontWeight:800, letterSpacing:'-0.03em', color:'#171A21', marginBottom:12 }}>Unlock Your Full Potential</h1>
          <p style={{ fontSize:17, color:'#6B7385', maxWidth:480, margin:'0 auto' }}>Choose the plan that fits your ambition.</p>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:20 }}>
          {plans.map(plan => (
            <div key={plan.name} style={{ background: plan.highlight ? 'linear-gradient(135deg,#171A21,#0F6F73)' : 'white', borderRadius:24, padding:'36px 28px', boxShadow: plan.highlight ? '0 12px 48px rgba(15,111,115,0.3)' : '0 4px 16px rgba(23,26,33,0.08)', position:'relative', transform: plan.highlight ? 'scale(1.04)' : 'scale(1)' }}>
              {plan.highlight && <div style={{ position:'absolute', top:-1, left:'50%', transform:'translateX(-50%)', background:'linear-gradient(135deg,#F77F00,#E06B00)', color:'white', fontSize:11, fontWeight:700, padding:'4px 16px', borderRadius:999, whiteSpace:'nowrap' }}>Most Popular</div>}
              <div style={{ fontSize:14, fontWeight:700, color: plan.highlight ? 'rgba(255,255,255,0.6)' : '#9AA0AE', marginBottom:12 }}>{plan.name}</div>
              <div style={{ display:'flex', alignItems:'baseline', gap:4, marginBottom:6 }}>
                <span style={{ fontSize:36, fontWeight:800, color: plan.highlight ? 'white' : '#171A21', letterSpacing:'-0.02em' }}>{plan.price}</span>
                <span style={{ fontSize:14, color: plan.highlight ? 'rgba(255,255,255,0.5)' : '#9AA0AE' }}>/{plan.period}</span>
              </div>
              <div style={{ height:1, background: plan.highlight ? 'rgba(255,255,255,0.1)' : '#F4F5F7', marginBottom:24, marginTop:20 }}></div>
              <ul style={{ listStyle:'none', marginBottom:28 }}>
                {plan.features.map(f => (
                  <li key={f} style={{ display:'flex', alignItems:'center', gap:10, fontSize:14, color: plan.highlight ? 'rgba(255,255,255,0.8)' : '#444B5A', padding:'5px 0' }}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={plan.highlight ? '#2BBEC5' : '#0F6F73'} strokeWidth="2.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                    {f}
                  </li>
                ))}
              </ul>
              <button onClick={() => plan.name !== 'Free' && onNavigate('discover')} style={{ width:'100%', fontFamily:'Inter,sans-serif', fontSize:14, fontWeight:700, background: plan.highlight ? 'linear-gradient(135deg,#F77F00,#E06B00)' : plan.name==='Free' ? '#F4F5F7' : 'transparent', color: plan.highlight ? 'white' : plan.name==='Free' ? '#9AA0AE' : '#0F6F73', border: plan.name==='Business' ? '2px solid #0F6F73' : 'none', borderRadius:12, padding:'12px 0', cursor: plan.name==='Free' ? 'default':'pointer', boxShadow: plan.highlight ? '0 4px 20px rgba(247,127,0,0.35)':'none' }}>{plan.cta}</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
