<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-family); background: #F4F5F7; padding: 24px; display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .card {
    background: white;
    border-radius: 12px;
    border: 1px solid rgba(15,111,115,0.10);
    padding: 20px;
    width: 220px;
  }
  .card-accent {
    border-radius: 12px;
    overflow: hidden;
    width: 220px;
    background: white;
  }
  .accent-bar { height: 3px; background: linear-gradient(90deg, #0F6F73, #1A9DA3); }
  .card-accent-inner { padding: 20px; }
  .avatar { width: 40px; height: 40px; border-radius: 999px; background: linear-gradient(135deg,#0F6F73,#1A9DA3); margin-bottom: 12px; }
  .name { font-size: 15px; font-weight: 600; color: #171A21; }
  .role { font-size: 13px; color: #6B7385; margin-top: 2px; }
  .divider { height: 1px; background: #F4F5F7; margin: 14px 0; }
  .stat { font-size: 12px; color: #9AA0AE; }
  .stat span { font-weight: 600; color: #171A21; }
</style>
</head>
<body>
  <!-- Informational -->
  <div class="card">
    <div class="avatar"></div>
    <div class="name">Informational Card</div>
    <div class="role">12px radius · no shadow</div>
    <div class="divider"></div>
    <div class="stat">Connections: <span>248</span></div>
    <div class="stat" style="margin-top:4px;">Posts: <span>32</span></div>
  </div>
  <!-- Gradient accent -->
  <div class="card-accent" style="box-shadow: 0 1px 4px rgba(23,26,33,0.08);">
    <div class="accent-bar"></div>
    <div class="card-accent-inner">
      <div class="avatar" style="background:linear-gradient(135deg,#F77F00,#E06B00);"></div>
      <div class="name">Gradient Accent Card</div>
      <div class="role">3px top border gradient</div>
      <div class="divider"></div>
      <div class="stat">Featured profile</div>
    </div>
  </div>
</body>
</html>
