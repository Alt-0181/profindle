<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-family); background: #F4F5F7; padding: 24px; display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 16px rgba(23,26,33,0.10);
    padding: 22px;
    width: 220px;
    transition: transform 250ms cubic-bezier(0.4,0,0.2,1), box-shadow 250ms cubic-bezier(0.4,0,0.2,1);
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 8px 32px rgba(15,111,115,0.16);
  }
  .avatar { width: 44px; height: 44px; border-radius: 999px; background: linear-gradient(135deg,#0F6F73,#1A9DA3); margin-bottom: 12px; }
  .name { font-size: 15px; font-weight: 600; color: #171A21; }
  .role { font-size: 13px; color: #6B7385; margin-top: 2px; }
  .divider { height: 1px; background: #F4F5F7; margin: 14px 0; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  .tag-teal { background: #F0F9F9; color: #0F6F73; }
  .tag-amber { background: #FFF6EC; color: #F77F00; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar"></div>
    <div class="name">Interactive Card</div>
    <div class="role">Hover to see lift effect</div>
    <div class="divider"></div>
    <div class="tags">
      <span class="tag tag-teal">Product</span>
      <span class="tag tag-teal">Design</span>
    </div>
  </div>
  <div class="card" style="background:linear-gradient(135deg,#171A21 0%,#0F6F73 100%);">
    <div class="avatar" style="background:rgba(255,255,255,0.15);"></div>
    <div class="name" style="color:white;">Dark Variant</div>
    <div class="role" style="color:rgba(255,255,255,0.6);">Hero dark card</div>
    <div class="divider" style="background:rgba(255,255,255,0.1);"></div>
    <div class="tags">
      <span class="tag" style="background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.85);">Featured</span>
      <span class="tag tag-amber">Pro</span>
    </div>
  </div>
</body>
</html>
