<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-family); background: white; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 13px; font-weight: 600; color: #171A21; }
  input, select, textarea {
    font-family: var(--font-family);
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1.5px solid #E4E7ED;
    color: #171A21;
    background: white;
    outline: none;
    transition: border-color 150ms, box-shadow 150ms;
    width: 320px;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #0F6F73;
    box-shadow: 0 0 0 3px rgba(15,111,115,0.12);
  }
  input::placeholder { color: #9AA0AE; }
  .input-error { border-color: #FF5A5F !important; }
  .input-error:focus { box-shadow: 0 0 0 3px rgba(255,90,95,0.12) !important; }
  .hint { font-size: 12px; color: #9AA0AE; }
  .hint-error { color: #FF5A5F; }
  .row { display: flex; gap: 14px; align-items: flex-start; }
</style>
</head>
<body>
  <div class="field">
    <label>Full Name</label>
    <input type="text" placeholder="e.g. Alex Morgan">
    <span class="hint">As it appears on your profile</span>
  </div>
  <div class="field">
    <label>Role</label>
    <input type="text" value="Senior Product Designer" style="border-color:#0F6F73;box-shadow:0 0 0 3px rgba(15,111,115,0.12);">
    <span class="hint">Focused state</span>
  </div>
  <div class="field">
    <label>Email</label>
    <input class="input-error" type="email" value="notanemail">
    <span class="hint hint-error">Enter a valid email address</span>
  </div>
  <div class="field">
    <label>Expertise</label>
    <select><option>Product Design</option><option>Engineering</option><option>Marketing</option></select>
  </div>
</body>
</html>
