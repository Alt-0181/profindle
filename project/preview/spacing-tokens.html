<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-family); background: white; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; align-items: end; }
  .token { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .block { background: #0F6F73; border-radius: 4px; width: 100%; }
  .label { font-size: 11px; font-weight: 600; color: #444B5A; text-align: center; }
  .px { font-size: 10px; color: #9AA0AE; text-align: center; font-family: monospace; }
</style>
</head>
<body>
  <div class="grid">
    <div class="token"><div class="block" style="height:4px;"></div><div class="label">space-1</div><div class="px">4px</div></div>
    <div class="token"><div class="block" style="height:8px;"></div><div class="label">space-2</div><div class="px">8px</div></div>
    <div class="token"><div class="block" style="height:12px;"></div><div class="label">space-3</div><div class="px">12px</div></div>
    <div class="token"><div class="block" style="height:16px;"></div><div class="label">space-4</div><div class="px">16px</div></div>
    <div class="token"><div class="block" style="height:24px;"></div><div class="label">space-6</div><div class="px">24px</div></div>
    <div class="token"><div class="block" style="height:32px;"></div><div class="label">space-8</div><div class="px">32px</div></div>
    <div class="token"><div class="block" style="height:48px;"></div><div class="label">space-12</div><div class="px">48px</div></div>
    <div class="token"><div class="block" style="height:64px;"></div><div class="label">space-16</div><div class="px">64px</div></div>
  </div>
</body>
</html>
