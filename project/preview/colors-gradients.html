<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-family); background: #F4F5F7; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .grad { border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-medium); height: 90px; display: flex; align-items: flex-end; padding: 12px 16px; position: relative; }
  .grad-label { font-size: 12px; font-weight: 600; color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
  .grad-sub { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 2px; font-family: monospace; }
</style>
</head>
<body>
<div class="grid">
  <div class="grad" style="background: linear-gradient(135deg, #171A21 0%, #0F6F73 100%);">
    <div><div class="grad-label">Hero Gradient</div><div class="grad-sub">Charcoal → Teal 600</div></div>
  </div>
  <div class="grad" style="background: linear-gradient(135deg, #0F6F73 0%, #1A9DA3 100%);">
    <div><div class="grad-label">Primary Button</div><div class="grad-sub">Teal 600 → Teal 500</div></div>
  </div>
  <div class="grad" style="background: linear-gradient(135deg, #F77F00 0%, #E06B00 100%);">
    <div><div class="grad-label">Premium Badge</div><div class="grad-sub">Amber 500 → Amber 600</div></div>
  </div>
  <div class="grad" style="background: linear-gradient(90deg, #0F6F73 0%, #F77F00 100%);">
    <div><div class="grad-label">Stats / Text Gradient</div><div class="grad-sub">Teal 600 → Amber 500</div></div>
  </div>
</div>
</body>
</html>
