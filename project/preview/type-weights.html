<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-family); background: white; padding: 24px 28px; }
  .row { display: flex; align-items: center; gap: 20px; padding: 11px 0; border-bottom: 1px solid #F4F5F7; }
  .row:last-child { border-bottom: none; }
  .meta { width: 90px; flex-shrink: 0; font-size: 11px; color: #9AA0AE; }
  .sample { font-size: 22px; color: #171A21; }
  .badge { font-size: 11px; font-weight: 500; color: #6B7385; background: #F4F5F7; padding: 2px 8px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="row">
    <div class="meta">400 · Normal</div>
    <div class="sample" style="font-weight:400;">Inter Regular — the quick brown fox</div>
    <div class="badge">Body</div>
  </div>
  <div class="row">
    <div class="meta">500 · Medium</div>
    <div class="sample" style="font-weight:500;">Inter Medium — the quick brown fox</div>
    <div class="badge">UI Labels</div>
  </div>
  <div class="row">
    <div class="meta">600 · SemiBold</div>
    <div class="sample" style="font-weight:600;">Inter SemiBold — the quick brown fox</div>
    <div class="badge">Headings</div>
  </div>
  <div class="row">
    <div class="meta">700 · Bold</div>
    <div class="sample" style="font-weight:700;">Inter Bold — the quick brown fox</div>
    <div class="badge">Display</div>
  </div>
  <div class="row">
    <div class="meta">Gradient</div>
    <div class="sample" style="font-weight:700;background:linear-gradient(90deg,#0F6F73,#F77F00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Stats &amp; Key Numbers</div>
    <div class="badge">Gradient text</div>
  </div>
</body>
</html>
