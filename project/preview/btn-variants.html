<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-family); background: white; padding: 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  button {
    font-family: var(--font-family);
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    padding: 10px 22px;
    border-radius: 12px;
    transition: all 150ms cubic-bezier(0.4,0,0.2,1);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #0F6F73 0%, #1A9DA3 100%);
    color: white;
    box-shadow: 0 2px 8px rgba(15,111,115,0.2);
  }
  .btn-primary:hover { filter: brightness(1.08); box-shadow: 0 4px 16px rgba(15,111,115,0.3); }
  .btn-secondary {
    background: transparent;
    color: #0F6F73;
    border: 1.5px solid #0F6F73;
  }
  .btn-secondary:hover { background: rgba(15,111,115,0.06); }
  .btn-premium {
    background: linear-gradient(135deg, #F77F00 0%, #E06B00 100%);
    color: white;
    box-shadow: 0 2px 8px rgba(247,127,0,0.22);
  }
  .btn-premium:hover { filter: brightness(1.06); box-shadow: 0 4px 16px rgba(247,127,0,0.3); }
  .btn-ghost {
    background: transparent;
    color: #444B5A;
    border: 1.5px solid #E4E7ED;
  }
  .btn-ghost:hover { background: #F4F5F7; border-color: #C8CDD7; }
  .btn-text {
    background: none;
    border: none;
    color: #0F6F73;
    font-weight: 500;
    padding: 10px 4px;
    text-decoration: none;
  }
  .btn-text:hover { text-decoration: underline; }
  .btn-sm { padding: 7px 14px; font-size: 13px; border-radius: 10px; }
  .btn-lg { padding: 14px 32px; font-size: 16px; border-radius: 14px; }
  .label { font-size: 11px; font-weight: 600; color: #9AA0AE; letter-spacing: 0.06em; text-transform: uppercase; width: 100%; margin-bottom: -4px; }
</style>
</head>
<body>
  <div class="row"><div class="label">Primary</div></div>
  <div class="row">
    <button class="btn-primary btn-sm">Small</button>
    <button class="btn-primary">Get Started</button>
    <button class="btn-primary btn-lg">Large CTA</button>
  </div>
  <div class="row" style="margin-top:8px;"><div class="label">Variants</div></div>
  <div class="row">
    <button class="btn-secondary">View Profile</button>
    <button class="btn-premium">Upgrade to Pro</button>
    <button class="btn-ghost">Cancel</button>
    <button class="btn-text">Learn more →</button>
  </div>
</body>
</html>
