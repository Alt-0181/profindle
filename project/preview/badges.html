<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-family); background: white; padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600;
    padding: 4px 12px; border-radius: 999px;
  }
  .badge-teal   { background: #F0F9F9; color: #0F6F73; }
  .badge-amber  { background: linear-gradient(135deg,#F77F00,#E06B00); color: white; }
  .badge-coral  { background: #FFF0F0; color: #E04347; }
  .badge-dark   { background: #171A21; color: white; }
  .badge-outline { border: 1.5px solid #E4E7ED; color: #444B5A; background: transparent; }
  .badge-new    { background: linear-gradient(135deg,#0F6F73,#1A9DA3); color: white; }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; opacity: 0.7; }
  .label { font-size: 11px; font-weight: 600; color: #9AA0AE; text-transform: uppercase; letter-spacing: 0.06em; width: 100%; }
</style>
</head>
<body>
  <div class="row"><div class="label">Status Badges</div></div>
  <div class="row">
    <span class="badge badge-teal"><span class="dot"></span>Active</span>
    <span class="badge badge-coral"><span class="dot"></span>Unavailable</span>
    <span class="badge badge-outline">Open to Work</span>
    <span class="badge badge-dark">Verified</span>
  </div>
  <div class="row"><div class="label">Feature Badges</div></div>
  <div class="row">
    <span class="badge badge-amber">✦ Pro</span>
    <span class="badge badge-new">New</span>
    <span class="badge badge-teal">Featured</span>
    <span class="badge badge-coral">Hot</span>
  </div>
  <div class="row"><div class="label">Skill Tags</div></div>
  <div class="row">
    <span class="badge badge-outline">Product Design</span>
    <span class="badge badge-outline">UX Research</span>
    <span class="badge badge-outline">Figma</span>
    <span class="badge badge-teal">Leadership</span>
  </div>
</body>
</html>
