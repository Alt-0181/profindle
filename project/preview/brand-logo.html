<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F4F5F7; padding: 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .tile { border-radius: 14px; padding: 32px 28px; display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
  .light  { background: #FFFFFF; border: 1px solid #E4E7ED; }
  .dark   { background: #171A21; }
  .teal   { background: #0F6F73; }
  .amber  { background: #F77F00; }
  .label  { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #9AA0AE; }
  .label-inv { color: rgba(255,255,255,0.4); }

  /* ── Logo lockup ─────────────────── */
  .logo { display: flex; align-items: center; gap: 10px; }
  .wordmark { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  /* Pro=teal, find=amber, le=teal */
  .wm-light .pro    { color: #0F6F73; }
  .wm-light .find   { color: #F77F00; }
  .wm-light .le     { color: #0F6F73; }
  .wm-dark  .pro,
  .wm-dark  .le     { color: white; }
  .wm-dark  .find   { color: #F77F00; }
  .wm-amber .pro,
  .wm-amber .le     { color: white; }
  .wm-amber .find   { color: white; }
</style>
</head>
<body>

<!-- ON LIGHT -->
<div class="tile light" style="grid-column: 1;">
  <div class="logo">
    <!-- Mark: teal circle + amber arc + teal body + amber dot -->
    <svg width="30" height="40" viewBox="-3 -3 44 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18.56 34.56C27.3966 34.56 34.56 27.3966 34.56 18.56C34.56 9.72345 27.3966 2.56 18.56 2.56C9.72344 2.56 2.56 9.72345 2.56 18.56C2.56 27.3966 9.72344 34.56 18.56 34.56Z" stroke="#0F6F73" stroke-width="5.12" stroke-linecap="round"/>
      <path d="M18.56 8.96C23.8619 8.96 28.16 13.2581 28.16 18.56" stroke="#F77F00" stroke-width="5.12" stroke-linecap="round"/>
      <path d="M5.76001 47.36C5.76001 47.36 5.76001 34.56 18.56 34.56" stroke="#0F6F73" stroke-width="5.12" stroke-linecap="round"/>
      <path d="M18.56 34.56L31.36 47.36" stroke="#0F6F73" stroke-width="5.12" stroke-linecap="round"/>
      <path d="M18.56 38.4C20.6807 38.4 22.4 36.6808 22.4 34.56C22.4 32.4392 20.6807 30.72 18.56 30.72C16.4392 30.72 14.72 32.4392 14.72 34.56C14.72 36.6808 16.4392 38.4 18.56 38.4Z" fill="#F77F00"/>
    </svg>
    <div class="wordmark"><span style="color:#0F6F73">Pro</span><span style="color:#F77F00">find</span><span style="color:#0F6F73">le</span></div>
  </div>
  <div class="label">Light Background</div>
</div>

<!-- ON DARK -->
<div class="tile dark" style="grid-column: 2;">
  <div class="logo">
    <svg width="30" height="40" viewBox="-3 -3 44 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18.56 34.56C27.3966 34.56 34.56 27.3966 34.56 18.56C34.56 9.72345 27.3966 2.56 18.56 2.56C9.72344 2.56 2.56 9.72345 2.56 18.56C2.56 27.3966 9.72344 34.56 18.56 34.56Z" stroke="white" stroke-width="5.12" stroke-linecap="round"/>
      <path d="M18.56 8.96C23.8619 8.96 28.16 13.2581 28.16 18.56" stroke="#F77F00" stroke-width="5.12" stroke-linecap="round"/>
      <path d="M5.76001 47.36C5.76001 47.36 5.76001 34.56 18.56 34.56" stroke="white" stroke-width="5.12" stroke-linecap="round"/>
      <path d="M18.56 34.56L31.36 47.36" stroke="white" stroke-width="5.12" stroke-linecap="round"/>
      <path d="M18.56 38.4C20.6807 38.4 22.4 36.6808 22.4 34.56C22.4 32.4392 20.6807 30.72 18.56 30.72C16.4392 30.72 14.72 32.4392 14.72 34.56C14.72 36.6808 16.4392 38.4 18.56 38.4Z" fill="#F77F00"/>
    </svg>
    <div class="wordmark"><span style="color:white">Pro</span><span style="color:#F77F00">find</span><span style="color:white">le</span></div>
  </div>
  <div class="label label-inv">Dark Background</div>
</div>

<!-- MARK ONLY — exact original Figma SVG, no scaling tricks -->
<div class="tile light" style="grid-column: 3; align-items: center; justify-content: center;">
  <svg width="76" height="100" viewBox="0 0 38 50" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M18.56 34.56C27.3966 34.56 34.56 27.3966 34.56 18.56C34.56 9.72345 27.3966 2.56 18.56 2.56C9.72344 2.56 2.56 9.72345 2.56 18.56C2.56 27.3966 9.72344 34.56 18.56 34.56Z" stroke="#0F6F73" stroke-width="5.12" stroke-linecap="round"/>
    <path d="M18.56 8.96C23.8619 8.96 28.16 13.2581 28.16 18.56" stroke="#F77F00" stroke-width="5.12" stroke-linecap="round"/>
    <path d="M5.76001 47.36C5.76001 47.36 5.76001 34.56 18.56 34.56" stroke="#0F6F73" stroke-width="5.12" stroke-linecap="round"/>
    <path d="M18.56 34.56L31.36 47.36" stroke="#0F6F73" stroke-width="5.12" stroke-linecap="round"/>
    <path d="M18.56 38.4C20.6807 38.4 22.4 36.6808 22.4 34.56C22.4 32.4392 20.6807 30.72 18.56 30.72C16.4392 30.72 14.72 32.4392 14.72 34.56C14.72 36.6808 16.4392 38.4 18.56 38.4Z" fill="#F77F00"/>
  </svg>
  <div class="label">Mark Only</div>
</div>

    <svg width="30" height="40" viewBox="-3 -3 44 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18.56 34.56C27.3966 34.56 34.56 27.3966 34.56 18.56C34.56 9.72345 27.3966 2.56 18.56 2.56C9.72344 2.56 2.56 9.72345 2.56 18.56C2.56 27.3966 9.72344 34.56 18.56 34.56Z" stroke="white" stroke-width="5.12" stroke-linecap="round"/>

      <path d="M18.56 38.4C20.6807 38.4 22.4 36.6808 22.4 34.56C22.4 32.4392 20.6807 30.72 18.56 30.72C16.4392 30.72 14.72 32.4392 14.72 34.56C14.72 36.6808 16.4392 38.4 18.56 38.4Z" fill="#F77F00"/>
    </svg>
    <div class="wordmark"><span style="color:white">Pro</span><span style="color:#F77F00">find</span><span style="color:white">le</span></div>
  </div>
  <div class="label label-inv">Brand Background</div>
</div>

      <path d="M5.76001 47.36C5.76001 47.36 5.76001 34.56 18.56 34.56" stroke="white" stroke-width="5.12" stroke-linecap="round"/>
      <path d="M18.56 34.56L31.36 47.36" stroke="white" stroke-width="5.12" stroke-linecap="round"/>
      <path d="M18.56 38.4C20.6807 38.4 22.4 36.6808 22.4 34.56C22.4 32.4392 20.6807 30.72 18.56 30.72C16.4392 30.72 14.72 32.4392 14.72 34.56C14.72 36.6808 16.4392 38.4 18.56 38.4Z" fill="#F77F00"/>
    </svg>
    <div class="wordmark"><span style="color:white">Pro</span><span style="color:rgba(255,255,255,0.6)">find</span><span style="color:white">le</span></div>
  </div>
  <div class="label label-inv">Accent Background</div>
</div>

      <path d="M18.56 34.56C27.3966 34.56 34.56 27.3966 34.56 18.56C34.56 9.72345 27.3966 2.56 18.56 2.56C9.72344 2.56 2.56 9.72345 2.56 18.56C2.56 27.3966 9.72344 34.56 18.56 34.56Z" stroke="#0F6F73" stroke-width="5.12" stroke-linecap="round"/>

    </svg>
      <div class="wordmark"><span style="color:#0F6F73">Pro</span><span style="color:#F77F00">find</span><span style="color:#0F6F73">le</span></div>

      <path d="M18.56 34.56C27.3966 34.56 34.56 27.3966 34.56 18.56C34.56 9.72345 27.3966 2.56 18.56 2.56C9.72344 2.56 2.56 9.72345 2.56 18.56C2.56 27.3966 9.72344 34.56 18.56 34.56Z" stroke="#0F6F73" stroke-width="5.12" stroke-linecap="round"/>

</body>
</html>
