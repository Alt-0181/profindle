<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-family); background: #F4F5F7; padding: 28px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .item { background: white; border-radius: 12px; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 64px; height: 64px; background: white; border-radius: 10px; }
  .label { font-size: 12px; font-weight: 600; color: #171A21; }
  .val { font-size: 10px; color: #9AA0AE; font-family: monospace; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item">
      <div class="box" style="box-shadow: 0 1px 4px rgba(23,26,33,0.08);"></div>
      <div class="label">Low</div>
      <div class="val">0 1px 4px<br>rgba(23,26,33,0.08)</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: 0 4px 16px rgba(23,26,33,0.12);"></div>
      <div class="label">Medium</div>
      <div class="val">0 4px 16px<br>rgba(23,26,33,0.12)</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: 0 8px 32px rgba(23,26,33,0.16);"></div>
      <div class="label">High</div>
      <div class="val">0 8px 32px<br>rgba(23,26,33,0.16)</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: 0 4px 24px rgba(15,111,115,0.22); background: #F0F9F9;"></div>
      <div class="label">Teal Glow</div>
      <div class="val">0 4px 24px<br>rgba(15,111,115,0.22)</div>
    </div>
  </div>
</body>
</html>
